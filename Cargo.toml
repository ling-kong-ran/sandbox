[workspace]
members = [
  "crates/agent-sandbox-protocol",
  "crates/agent-sandbox-core",
  "crates/agent-sandboxd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ling-kong-ran/sandbox"
rust-version = "1.85"

[workspace.dependencies]
agent-sandbox-protocol = { path = "crates/agent-sandbox-protocol" }
agent-sandbox-core = { path = "crates/agent-sandbox-core" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
