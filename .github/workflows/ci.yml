name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_SANDBOX_CGROUP_ROOT: ${{ matrix.os == 'ubuntu-latest' && '/sys/fs/cgroup/agent-sandbox-ci' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Linux native sandbox prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo mkdir -p "$AGENT_SANDBOX_CGROUP_ROOT"
          sudo chown "$USER":"$(id -gn)" \
            "$AGENT_SANDBOX_CGROUP_ROOT" \
            "$AGENT_SANDBOX_CGROUP_ROOT/cgroup.procs" \
            "$AGENT_SANDBOX_CGROUP_ROOT/cgroup.subtree_control"
          echo '+cpu +memory +pids' > "$AGENT_SANDBOX_CGROUP_ROOT/cgroup.subtree_control"
          test -f "$AGENT_SANDBOX_CGROUP_ROOT/cgroup.controllers"
      - run: cargo build --workspace
      - name: Provision Windows native sandbox
        if: runner.os == 'Windows'
        run: target/debug/srt-win.exe install
      - name: Report native sandbox capability
        run: target/debug/agent-sandboxd probe --json
      - run: npm test
